<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  /* the star toggle + the row highlight it drives */
  #root .star:hover { color: #f59e0b !important; }
  #root tr.starred { background: #fff7e6 !important; box-shadow: inset 4px 0 0 #f59e0b !important; }
</style>
</head>
<body>
<div id="root"></div>
<script>
// ---- Streamlit component handshake (manual, no lib needed) ----
function send(type, data) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data || {}), "*");
}
function ready()  { send("streamlit:componentReady", { apiVersion: 1 }); }
function height(h){ send("streamlit:setFrameHeight", { height: h }); }

// ---- star state: lives in this component (persists across reruns + reloads) ----
var KEY = "nfo_star_players";
function load() { try { return new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch (e) { return new Set(); } }
function save(s){ try { localStorage.setItem(KEY, JSON.stringify(Array.from(s))); } catch (e) {} }
var stars = load();

function paint() {
  document.querySelectorAll("#root .star").forEach(function (el) {
    var name = el.getAttribute("data-player");
    var on = stars.has(name);
    var row = el.closest("tr");
    el.textContent = on ? "★" : "☆";
    el.style.color = on ? "#f59e0b" : "#8b93a0";
    if (row) row.classList.toggle("starred", on);   // add/remove cleanly -> reverts to inline styles when off
  });
}
function attach() {
  document.querySelectorAll("#root .star").forEach(function (el) {
    el.onclick = function (ev) {
      ev.preventDefault();
      var name = el.getAttribute("data-player");
      if (stars.has(name)) stars.delete(name); else stars.add(name);
      save(stars);
      paint();
    };
  });
}
function onRender(args) {
  document.getElementById("root").innerHTML = (args && args.html) || "";
  attach();
  paint();
  height(document.documentElement.scrollHeight);
}
window.addEventListener("message", function (e) {
  if (e.data && e.data.type === "streamlit:render") onRender(e.data.args);
});
ready();
height(0);
</script>
</body>
</html>
